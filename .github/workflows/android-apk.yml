name: Build Motor Navigatie Benelux APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Haal project op
        uses: actions/checkout@v4
      - name: Installeer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installeer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Installeer projectpakketten
        run: npm install
      - name: Maak webmap www
        run: npm run build
      - name: Controleer webbestanden
        run: test -s www/index.html && test -s www/app.js
      - name: Voeg Android-platform toe
        run: npx cap add android
      - name: Synchroniseer Capacitor
        run: npx cap sync android
      - name: Voeg expliciete Android GPS-machtigingen toe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
          ]
          for item in permissions:
              if item not in s:
                  s = s.replace('<application', item + '\\n    <application', 1)
          p.write_text(s)
          print('GPS permissions added to', p)
          PY
      - name: Bouw test-APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotorNavigatie-Benelux-v1.2-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
